---
# ###################################################################
# Example : Create shared ldev playbook
# Note - Update the ldev id, name, pool id and size for your deployment
# Post execution run playbook day0_vsp_one_shared_ldev_facts.yml
# ###################################################################
- name: Logical Device Module
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:
    # ###################################################################
    # Task Name : Create the first shared ldev with a specific LDEV ID and name
    # ###################################################################
    - name: Create ldev
      hitachivantara.vspone_block.vsp.hv_ldev:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          capacity_saving: "compression_deduplication"
          data_reduction_share: true
          ldev_id: 4
          name: Application_VMFS_Volume
          pool_id: 1
          size: 10TB
      register: result

    - name: Playbook summary
      ansible.builtin.debug:
        var: result
        
    # ###################################################################
    # Task Name : Create the second shared ldev with a specific LDEV ID and name
    # ###################################################################
    - name: Create ldev
      hitachivantara.vspone_block.vsp.hv_ldev:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          capacity_saving: "compression_deduplication"
          data_reduction_share: true
          ldev_id: 5
          name: Application_VMFS_Volume1
          pool_id: 1
          size: 10TB
      register: result1

    - name: Playbook summary 1
      ansible.builtin.debug:
        var: result1
