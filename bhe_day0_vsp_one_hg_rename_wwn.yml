# ###################################################################
# Example : Hostgroup Playbook
# Update the playbook for you deployment
# ************************************************************************************************
# NOTE - B85 will use ports CL1-A, CL2-A, CL1-B, and CL2-B. Update the playbook when ready to test
# ************************************************************************************************
# Post execution run the following playbook day0_vsp_one_hostgroup_facts.yml
# ###################################################################
- name: Hostgroup Module
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:

    ####################################################################
    # Task Name : Change or unset nickname of a wwn (existing wwn) 1st server
    ####################################################################
    - name: Change or unset nickname of a wwn (existing wwn) UCS-ESX-001 CL1-A
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          state: "add_wwn"
          name: "UCS-ESX-001"
          port_id: "CL1-A"
          wwns:
            - wwn: "20000025b5210a00"
              nickname: "ESX-001-Fabric-A"
      register: result_cl1a_001

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result_cl1a_001

