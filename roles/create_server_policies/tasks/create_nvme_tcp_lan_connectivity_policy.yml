      <<: *api_info_nvme_tcp
      resource_path: /vnic/EthIfs
      query_params:
         $filter: "Name eq '{{ name_of_nvme_tcp_vnic_5 }}'"
      api_body: {
           "Name": "{{ name_of_nvme_tcp_vnic_5 }}",
           "MacAddressType": "POOL",
           "MacPool": "{{ mac_pool_fi_b_details.api_response.Moid }}",
           "Placement": {
               "AutoPciLink": true,
               "AutoSlotId": true,
               "SwitchId": "A"
           },
           "Cdn": {
              "Source": "vnic"
           },
           "FailoverEnabled": false,
           "FabricEthNetworkGroupPolicy": [ "{{ ipstorage_a_network_group_policy.api_response.Moid }}" ],
           "FabricEthNetworkControlPolicy": "{{ ethernet_network_control_policy.api_response.Moid }}",
           "EthQosPolicy": "{{ ethernet_qos_policy.api_response.Moid }}",
           "EthAdapterPolicy": "{{ ethernet_adapter_hightrf_policy.api_response.Moid }}",
           "StaticMacAddress": "",
           "LanConnectivityPolicy": "{{ nvme_tcp_lan_connectivity_policy.api_response.Moid }}",
           "Order": 4
       }

  - name: "Add {{ name_of_nvme_tcp_vnic_6 }}  to LAN Connectivity Policy"
    cisco.intersight.intersight_rest_api:
