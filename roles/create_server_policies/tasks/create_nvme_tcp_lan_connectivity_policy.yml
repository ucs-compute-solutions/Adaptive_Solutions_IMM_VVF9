---

- name: "Configure NVMe-TCP LAN Connectivity Policy"
  vars:
    api_info: &api_info_nvme_tcp
      api_private_key: "{{ intersight_api_private_key }}"
      api_key_id: "{{ intersight_api_key_id }}"
      api_uri: "{{ api_uri | default(omit) }}"
      validate_certs: "{{ validate_certs | default(omit) }}"
      state: "{{ state | default(omit) }}"
  block:
  - name: "LAN Connectivity Policy"
    cisco.intersight.intersight_rest_api:
          <<: *api_info_nvme_tcp
          resource_path: /vnic/LanConnectivityPolicies
          query_params:
             $filter: "Name eq '{{ name_of_nvme_tcp_lan_connectivity_policy }}'"
          api_body: {
              "Name": "{{ name_of_nvme_tcp_lan_connectivity_policy }}",
              "Description": "{{ description_of_nvme_tcp_lan_connectivity_policy }}",

              "TargetPlatform": "FIAttached",
              "AzureQosEnabled": false,
              "IqnAllocationType": "None",
              "PlacementMode": "custom",
              "IqnPool": "",
              "StaticIqnName": "",

              "Organization": {
                 "Moid": "{{ intersight_org.api_response.Moid }}"
               },
              Tags: [{Key: "configmode", Value: "Intersight-Ansible"},{Key: "prefix", Value: "{{ prefix }}"}]  
           }
    register: nvme_tcp_lan_connectivity_policy

  - name: "Add {{ name_of_nvme_tcp_vnic_1 }} to LAN Connectivity Policy"
    cisco.intersight.intersight_rest_api:
        <<: *api_info_nvme_tcp
        resource_path: /vnic/EthIfs
        query_params:
           $filter: "Name eq '{{ name_of_nvme_tcp_vnic_1 }}'"
        api_body: {
             "Name": "{{ name_of_nvme_tcp_vnic_1 }}",
             "MacAddressType": "POOL",
             "MacPool": "{{ mac_pool_fi_a_details.api_response.Moid }}",
             "Placement": {
                "AutoPciLink": true,
                "AutoSlotId": true,
                "SwitchId": "A"
             },
             "Cdn": {
                "Source": "vnic"
             },
             "FailoverEnabled": false,
             "FabricEthNetworkGroupPolicy": [ "{{ management_network_group_policy.api_response.Moid }}" ],
             "FabricEthNetworkControlPolicy": "{{ ethernet_network_control_policy.api_response.Moid }}",
             "EthQosPolicy": "{{ ethernet_qos_policy.api_response.Moid }}",
             "EthAdapterPolicy": "{{ ethernet_adapter_vmware_policy.api_response.Moid }}",
             "StaticMacAddress": "",
             "LanConnectivityPolicy": "{{ nvme_tcp_lan_connectivity_policy.api_response.Moid }}",
             "Order": 0
         }

  - name: "Add {{ name_of_nvme_tcp_vnic_2 }} to LAN Connectivity Policy"
    cisco.intersight.intersight_rest_api:
        <<: *api_info_nvme_tcp
        resource_path: /vnic/EthIfs
        query_params:
           $filter: "Name eq '{{ name_of_nvme_tcp_vnic_2 }}'"
        api_body: {
             "Name": "{{ name_of_nvme_tcp_vnic_2 }}",
             "MacAddressType": "POOL",
             "MacPool": "{{ mac_pool_fi_b_details.api_response.Moid }}",
             "Placement": {
                "AutoPciLink": true,
                "AutoSlotId": true,
                "SwitchId": "B"
             },
             "Cdn": {
                "Source": "vnic"
             },
             "FailoverEnabled": false,
             "FabricEthNetworkGroupPolicy": [ "{{ management_network_group_policy.api_response.Moid }}" ],
             "FabricEthNetworkControlPolicy": "{{ ethernet_network_control_policy.api_response.Moid }}",
             "EthQosPolicy": "{{ ethernet_qos_policy.api_response.Moid }}",
             "EthAdapterPolicy": "{{ ethernet_adapter_vmware_policy.api_response.Moid }}",
             "StaticMacAddress": "",
             "LanConnectivityPolicy": "{{ nvme_tcp_lan_connectivity_policy.api_response.Moid }}",
             "Order": 1
         }

  - name: "Add {{ name_of_nvme_tcp_vnic_3 }}  to LAN Connectivity Policy"
    cisco.intersight.intersight_rest_api:
      <<: *api_info_nvme_tcp
      resource_path: /vnic/EthIfs
      query_params:
         $filter: "Name eq '{{ name_of_nvme_tcp_vnic_3 }}'"
      api_body: {
           "Name": "{{ name_of_nvme_tcp_vnic_3 }}",
           "MacAddressType": "POOL",
           "MacPool": "{{ mac_pool_fi_a_details.api_response.Moid }}",
           "Placement": {
               "AutoPciLink": true,
               "AutoSlotId": true,
               "SwitchId": "A"
           },
           "Cdn": {
              "Source": "vnic"
           },
           "FailoverEnabled": false,
           "FabricEthNetworkGroupPolicy": [ "{{ vmotion_network_group_policy.api_response.Moid }}" ],
           "FabricEthNetworkControlPolicy": "{{ ethernet_network_control_policy.api_response.Moid }}",
           "EthQosPolicy": "{{ ethernet_qos_policy.api_response.Moid }}",
           "EthAdapterPolicy": "{{ ethernet_adapter_hightrf_policy.api_response.Moid }}",
           "StaticMacAddress": "",
           "LanConnectivityPolicy": "{{ nvme_tcp_lan_connectivity_policy.api_response.Moid }}",
           "Order": 2          
       }


