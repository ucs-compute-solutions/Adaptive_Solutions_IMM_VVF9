---
  - name: "Configure Intel M7 Virtualization BIOS Policy"
    cisco.intersight.intersight_bios_policy:
      api_private_key: "{{ api_private_key }}"
      api_key_id: "{{ api_key_id }}"
      organization: "{{ org_name }}"
      name: "{{ name_of_m7_bios_policy }}"
      description: "{{ description_of_intel_m7_bios_policy }}"
      tags:
        - Key: "configmode"
          Value: "ansible"
        - Key: "prefix"
          Value: "{{ prefix }}"
      cdn_enable: "enabled"
      processor_c6report: "enabled"
      work_load_config: "Balanced"
    register: intel_m7_bios_policy
    when: server_cpu_type == "Intel"

  - name: "Configure Intel M8 Virtualization BIOS Policy"
    cisco.intersight.intersight_bios_policy:
      api_private_key: "{{ api_private_key }}"
      api_key_id: "{{ api_key_id }}"
      organization: "{{ org_name }}"
      name: "{{ name_of_m8_bios_policy }}"
      description: "{{ description_of_intel_m8_bios_policy }}"
      tags:
        - Key: "configmode"
          Value: "ansible"
        - Key: "prefix"
          Value: "{{ prefix }}"
      cpu_performance: "enterprise"
      energy_efficient_turbo: "enabled"
      epp_profile: "Performance"
      latency_optimized_mode: "enabled"
      processor_c1e: "disabled"
      pwr_perf_tuning: "bios"
      select_memory_ras_configuration: "adddc-sparing"
      work_load_config: "Balanced"
    register: intel_m8_bios_policy
    when: server_cpu_type == "Intel"

  - name: "Configure AMD M8 Virtualization BIOS Policy"
    cisco.intersight.intersight_bios_policy:
      api_private_key: "{{ api_private_key }}"
      api_key_id: "{{ api_key_id }}"
      organization: "{{ org_name }}"
      name: "{{ name_of_m8_bios_policy }}"
      description: "{{ description_of_amd_m8_bios_policy }}"
      tags:
        - Key: "configmode"
          Value: "ansible"
        - Key: "prefix"
          Value: "{{ prefix }}"
      cbs_cmn_gnb_smucppc: "enabled"
    register: amd_m8_bios_policy
    when: server_cpu_type == "AMD"




