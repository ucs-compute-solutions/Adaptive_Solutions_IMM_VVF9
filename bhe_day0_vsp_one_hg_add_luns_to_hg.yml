---
# ###################################################################
# Example : Hostgroup Playbook
# Note - The ldev ids referenced in the task below must match the
# the range of ldev ids created previously by the following playbooks:
#   a. day0_vsp_one_create_boot_ldevs.yml
#   b. day0_vsp_one_create_shared_ldev.yml
# Update the playbook for your deployment
# ************************************************************************************************
# NOTE - B85 will use ports CL1-A, CL2-A, CL1-B, and CL2-B. Update the playbook when ready to test
# ************************************************************************************************
# Post execution run playbook day0_vsp_one_hostgroup_facts.yml
# ###################################################################
- name: Hostgroup Module
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:
    ####################################################################
    # Task Name : Present lun_paths to hostgroup for the first server
    ####################################################################
    - name: Present lun_paths to hostgroup UCS-ESX-001 CL1-A
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          state: "present_ldev"
          name: "UCS-ESX-001"
          port_id: "CL1-A"
          lun_paths:
            - lun: 0
              ldev: 0
            - lun: 1
              ldev: 4
            - lun: 2
              ldev: 5
      register: result_UCS_ESX_001_CL1_A

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result_UCS_ESX_001_CL1_A

    - name: Present lun_paths to hostgroup UCS-ESX-001 CL2-A
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          state: "present_ldev"
          name: "UCS-ESX-001"
          port_id: "CL2-A"
          lun_paths:
            - lun: 0
              ldev: 0
            - lun: 1
              ldev: 4
            - lun: 2
              ldev: 5
      register: result_UCS_ESX_001_CL2_A

