    - name: Present lun_paths to hostgroup UCS-ESX-001 CL1-B
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          state: "present_ldev"
          name: "UCS-ESX-001"
          port_id: "CL1-B"
          lun_paths:
            - lun: 0
              ldev: 0
            - lun: 1
              ldev: 4
            - lun: 2
              ldev: 5
